<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quackstreet Crossing</title>
    <link rel="stylesheet"
href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito:wght@600;800&display=swap"
/>
    <!--
      Rosebud defaults disable accidental selection, context menus,
tap highlights,
      and native dragging during gameplay while preserving text
editing. Most games
      need no customization.
    -->
    <link rel="stylesheet" href="./rosebud-game-defaults.css" />
    <script src="./rosebud-game-defaults.js" defer></script>
    <script type="importmap">
      {
        "imports": {}
      }
    </script>
    <style>
      html, body, #game-container { width: 100%; height: 100%; margin:
0; padding: 0; background: #050505; overflow: hidden; }
      body { touch-action: none; font-family: system-ui, sans-serif; }
      canvas { display: block; position: absolute; }
      body { font-family: 'Nunito', sans-serif; }
      #overlay { position: absolute; inset: 0; display: flex;
flex-direction: column; align-items: center; justify-content: center;
gap: 20px; color: #fff; text-align: center; }
      #overlay.hidden { display: none; }
      #overlay h1 { font-family: 'Fredoka', sans-serif; font-size:
clamp(32px, 6vw, 84px); margin: 0; text-shadow: 0 6px 0 #0006; }
      #overlay p { font-size: clamp(14px, 1.6vw, 24px); max-width:
70vw; margin: 0; }
      #overlay button { font-family: 'Fredoka', sans-serif; font-size:
clamp(18px, 2vw, 30px); padding: 0.5em 1.4em; white-space: nowrap;
width: auto; min-width: max-content; border: none; border-radius:
16px; background: #ffb52e; color: #3a2100; cursor: pointer;
box-shadow: 0 6px 0 #a8660a; }
      #overlay button:hover { background: #ffd060; }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <div id="overlay"></div>
    <script type="module" src="main.js"></script>
    <script src="https://storage.googleapis.com/rosebud_staticfiles/ChatManager.js"></script>
    <script src="https://storage.googleapis.com/rosebud_staticfiles/ProgressLogger.js"></script>
    <script src="https://storage.googleapis.com/rosebud_staticfiles/OGP.js"></script>
  </body>
</html>
